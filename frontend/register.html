<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo">ShopEase</a>
    <nav>
      <a href="index.html">Products</a>
      <a href="cart.html">Cart (<span id="cart-badge">0</span>)</a>
    </nav>
  </header>

  <main class="container">
    <div class="form-card">
      <h2 style="margin-bottom: 1.5rem;">Create Account</h2>
      <div id="error-msg"></div>
      <form id="register-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required minlength="6">
        </div>
        <button type="submit" class="btn" style="width: 100%;">Register</button>
      </form>
      <p style="margin-top: 1rem; text-align: center;">Already registered? <a href="login.html">Login</a></p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
